name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate changelog
        run: bun src/scripts/generateChangelog.ts
      - name: Type check
        run: bun run build
      - name: Test
        run: bun test
      - name: Lint
        run: bun run lint
